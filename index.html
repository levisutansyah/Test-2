<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Vistacu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    overflow-x:auto;
}

.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
    text-align:center;
    color:white;
}

h1{
    margin-bottom:15px;
    font-size:3rem;
}

p{
    font-size:1.2rem;
    margin-bottom:25px;
}

.menu-grid{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:20px;
    margin:30px 0;
    flex-wrap:wrap;
}

.card{
    width:320px;
    background:#4b1f1f;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.25);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:15px;
}

.price{
    color:#ff6b35;
    font-size:32px;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff6b35;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff824f;
}

.love-btn{
    width:auto;
    padding:15px 30px;
}

#pesan{
    display:none;
    margin-top:25px;
    font-size:1.5rem;
    font-weight:bold;
}

.heart{
    position:fixed;
    color:white;
    opacity:0.8;
    pointer-events:none;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>❤️ VISTA VANI ❤️</h1>

    <p>
        UDAH NGANTUK?
        Semoga harimu menyenangkan yaaaahh ✨
    </p>

    <div class="menu-grid">

        <div class="card">
            <img src="Designer (1).png" alt="Lari">

            <div class="card-content">
                <div class="price">LARI</div>

                <button onclick="kirimWA('LARI BARENG')">
                    Pilih
                </button>
            </div>
        </div>

        <div class="card">
            <img src="Designer (2).png" alt="Ngopi">

            <div class="card-content">
                <div class="price">NGOPI</div>

                <button onclick="kirimWA('NGOPI BARENG')">
                    Pilih
                </button>
            </div>
        </div>

        <div class="card">
            <img src="Designer (3).png" alt="Makan">

            <div class="card-content">
                <div class="price">MAKAN</div>

                <button onclick="kirimWA('MAKAN BARENG')">
                    Pilih
                </button>
            </div>
        </div>

    </div>

    <button class="love-btn" onclick="tampilPesan()">
        Klik Aku 💌
    </button>

    <div id="pesan">
        Aku sayang kamu hari ini, besok, dan selamanya ❤️
        <small>By Vays ❤️</small>
    </div>

</div>

<script>

function tampilPesan(){
    document.getElementById("pesan").style.display="block";
}

function kirimWA(pilihan){

    const nomor = "6281261685327";

    let pesan =
`❤️ REPORT PILIHAN VISTA ❤️

Pilihan :
${pilihan}

Tanggal :
${new Date().toLocaleString('id-ID')}

Website By Vays ❤️`;

    window.open(`https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`, "_blank");
}

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    heart.style.animationDuration=(Math.random()*4+3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart,300);

</script>

</body>
